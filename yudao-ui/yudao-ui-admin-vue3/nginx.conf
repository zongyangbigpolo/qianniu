server {
    listen       80;
    server_name  localhost;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;

    root   /usr/share/nginx/html;
    index  index.html;

    # 前端路由（history 模式），刷新子路径不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端管理端 API
    location /admin-api/ {
        proxy_pass http://server:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 移动端/用户端 API（如有使用）
    location /app-api/ {
        proxy_pass http://server:48080/app-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（例如站内消息）
    location /infra/ws {
        proxy_pass http://server:48080/infra/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 接口文档（knife4j / swagger）
    location /doc.html {
        proxy_pass http://server:48080/doc.html;
        proxy_set_header Host $host;
    }

    location /webjars/ {
        proxy_pass http://server:48080/webjars/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://server:48080/v3/api-docs;
        proxy_set_header Host $host;
    }

    location /swagger-resources {
        proxy_pass http://server:48080/swagger-resources;
        proxy_set_header Host $host;
    }
}
