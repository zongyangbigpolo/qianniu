name: 🐮 千牛 Docker 构建与推送

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE_NAME: ${{ github.repository }}-server
  ADMIN_IMAGE_NAME: ${{ github.repository }}-admin

jobs:
  build-and-push-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 克隆代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境 (Java 25)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 构建后端 JAR 包
        run: mvn clean package -DskipTests

      - name: 🏗️ 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 登录到 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: 🐳 构建并推送后端 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./yudao-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:buildcache,mode=max

      - name: 📤 上传构建制品
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            yudao-server/target/yudao-server.jar
            yudao-server/target/yudao-server.jar.sha256
          retention-days: 30

      - name: ✅ 后端构建成功通知
        if: success()
        run: |
          echo "✅ 后端镜像已推送到: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}"
          echo "📦 镜像标签: ${{ steps.meta.outputs.tags }}"

  build-and-push-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 克隆代码
        uses: actions/checkout@v4

      - name: 🏗️ 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 登录到 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: 🐳 构建并推送前端 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./yudao-ui/yudao-ui-admin-vue3
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:buildcache,mode=max

      - name: ✅ 前端构建成功通知
        if: success()
        run: |
          echo "✅ 前端镜像已推送到: ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}"
          echo "📦 镜像标签: ${{ steps.meta.outputs.tags }}"

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push-server
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 克隆代码
        uses: actions/checkout@v4

      - name: 🔍 运行 Trivy 安全扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 上传扫描结果
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
