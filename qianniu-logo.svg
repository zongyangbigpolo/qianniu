<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变色 -->
  <defs>
    <linearGradient id="hornGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="#F0F8FF" rx="20"/>
  
  <!-- 左角 (黄色) -->
  <polygon points="35,45 25,20 45,25" fill="url(#hornGradient)"/>
  <!-- 左角光泽 -->
  <ellipse cx="35" cy="35" rx="8" ry="12" fill="#FFED4E" opacity="0.6"/>
  
  <!-- 右角 (黄色) -->
  <polygon points="165,45 175,20 155,25" fill="url(#hornGradient)"/>
  <!-- 右角光泽 -->
  <ellipse cx="165" cy="35" rx="8" ry="12" fill="#FFED4E" opacity="0.6"/>
  
  <!-- 头部 (粉红色圆形) -->
  <circle cx="100" cy="110" r="65" fill="url(#headGradient)" stroke="#FFC0CB" stroke-width="2"/>
  
  <!-- 脸部阴影 (渐变效果) -->
  <ellipse cx="100" cy="125" rx="60" ry="55" fill="#FFB6C1" opacity="0.3"/>
  
  <!-- 左耳 -->
  <ellipse cx="50" cy="75" rx="20" ry="35" fill="#FFB6C1" stroke="#FFC0CB" stroke-width="2"/>
  <ellipse cx="50" cy="80" rx="12" ry="22" fill="#FFC0CB"/>
  
  <!-- 右耳 -->
  <ellipse cx="150" cy="75" rx="20" ry="35" fill="#FFB6C1" stroke="#FFC0CB" stroke-width="2"/>
  <ellipse cx="150" cy="80" rx="12" ry="22" fill="#FFC0CB"/>
  
  <!-- 左眼 -->
  <ellipse cx="75" cy="100" rx="12" ry="18" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="75" cy="105" r="7" fill="#333"/>
  <circle cx="76" cy="102" r="3" fill="white"/>
  
  <!-- 右眼 -->
  <ellipse cx="125" cy="100" rx="12" ry="18" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="125" cy="105" r="7" fill="#333"/>
  <circle cx="126" cy="102" r="3" fill="white"/>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="120" rx="8" ry="10" fill="#333"/>
  <line x1="95" y1="130" x2="105" y2="130" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 嘴巴 (可爱笑容) -->
  <path d="M 90 140 Q 100 148 110 140" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- 舌头 -->
  <ellipse cx="100" cy="152" rx="6" ry="8" fill="#FF69B4"/>
  
  <!-- 左腮红 -->
  <circle cx="55" cy="120" r="10" fill="#FF69B4" opacity="0.5"/>
  
  <!-- 右腮红 -->
  <circle cx="145" cy="120" r="10" fill="#FF69B4" opacity="0.5"/>
  
  <!-- 脖子 -->
  <rect x="85" y="170" width="30" height="20" fill="#FFB6C1" rx="5"/>
  
  <!-- 文字: 千牛 -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">千牛</text>
</svg>
